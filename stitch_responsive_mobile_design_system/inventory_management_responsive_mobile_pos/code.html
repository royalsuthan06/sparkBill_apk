<!DOCTYPE html><html class="light" lang="en" style=""><head>

<title>CRACKER POS - Inventory</title>

<style>
        body {
            background-color: #f7f9fb; /* background */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .mobile-container {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            background-color: #f2f4f6; /* surface-container-low */
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }
        .content-canvas {
            flex: 1;
            padding-bottom: 64px; /* BottomNavBar height */
            overflow-y: auto;
        }
        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-surface font-body-md antialiased">
<div class="mobile-container">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 border-b border-outline-variant bg-surface flex items-center justify-between px-margin-mobile h-[48px]">
<div class="flex items-center gap-gutter text-primary w-full justify-start">
<h1 class="text-headline-md font-headline-md font-bold tracking-tight">Arun CRACKER</h1>
</div>
<button class="text-primary hover:bg-surface-container-low active:opacity-80 transition-opacity duration-150 p-1 rounded-full flex items-center justify-center">
</button>
</header>
<!-- Main Content -->
<main class="content-canvas flex flex-col">
<!-- Sticky Search & Filter Bar -->
<div class="sticky top-[48px] z-40 bg-surface border-b border-outline-variant px-margin-mobile py-stack-md flex flex-col gap-stack-md shadow-sm">
<!-- Search Input -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
<input class="w-full h-[40px] pl-10 pr-4 rounded-xl border border-outline bg-surface-container-lowest text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" placeholder="Search inventory..." type="text">
</div>
<!-- Filters -->
<div class="flex gap-gutter overflow-x-auto pb-1 no-scrollbar items-center">
<button class="h-[32px] px-3 rounded-full bg-primary-container text-on-primary-container border border-primary flex items-center gap-1 shrink-0">
<span class="text-body-sm font-headline-sm">All Categories</span>
<span class="material-symbols-outlined text-[16px]">arrow_drop_down</span>
</button>
<button class="h-[32px] w-[32px] rounded-full bg-surface-container-lowest text-on-surface-variant border border-outline-variant flex items-center justify-center shrink-0 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[18px]">tune</span>
</button>
</div>
</div>
<!-- Inventory List -->
<div class="flex flex-col pt-stack-sm pb-stack-lg w-full">
<!-- Item 1: Atom Bomb -->
<div class="bg-surface border-b border-outline-variant px-margin-mobile py-stack-md flex flex-col gap-stack-sm active:bg-surface-container-low transition-colors touch-pan-y w-full">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase tracking-wider">SKU-A101</span>
<h2 class="text-headline-sm font-headline-sm text-on-surface mt-1">Atom Bomb</h2>
<span class="text-body-sm font-body-sm text-secondary mt-0.5">Ground Bombs</span>
</div>
<div class="flex flex-col items-end">
<span class="text-data-md font-data-md text-on-surface font-semibold">₹145.00</span>
<button class="mt-2 text-error hover:bg-error-container/20 p-1 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button></div>
</div>
</div>
<!-- Item 2: Laxmi 28 (Low Stock) -->
<div class="bg-surface border-b border-outline-variant px-margin-mobile py-stack-md flex flex-col gap-stack-sm active:bg-surface-container-low transition-colors touch-pan-y w-full">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase tracking-wider">SKU-L028</span>
<h2 class="text-headline-sm font-headline-sm text-on-surface mt-1">Laxmi 28</h2>
<span class="text-body-sm font-body-sm text-secondary mt-0.5">Garlands</span>
</div>
<div class="flex flex-col items-end">
<span class="text-data-md font-data-md text-on-surface font-semibold">₹280.00</span>
<button class="mt-2 text-error hover:bg-error-container/20 p-1 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button></div>
</div>
</div>
<!-- Item 3: Peacock Fountain -->
<div class="bg-surface border-b border-outline-variant px-margin-mobile py-stack-md flex flex-col gap-stack-sm active:bg-surface-container-low transition-colors touch-pan-y w-full">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase tracking-wider">SKU-P205</span>
<h2 class="text-headline-sm font-headline-sm text-on-surface mt-1">Peacock Fountain</h2>
<span class="text-body-sm font-body-sm text-secondary mt-0.5">Flower Pots</span>
</div>
<div class="flex flex-col items-end">
<span class="text-data-md font-data-md text-on-surface font-semibold">₹350.00</span>
<button class="mt-2 text-error hover:bg-error-container/20 p-1 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button></div>
</div>
</div>
<!-- Item 4: Sky Shot 12 (Warning) -->
<div class="bg-surface border-b border-outline-variant px-margin-mobile py-stack-md flex flex-col gap-stack-sm active:bg-surface-container-low transition-colors touch-pan-y w-full">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase tracking-wider">SKU-S412</span>
<h2 class="text-headline-sm font-headline-sm text-on-surface mt-1">Sky Shot 12</h2>
<span class="text-body-sm font-body-sm text-secondary mt-0.5">Aerial Shells</span>
</div>
<div class="flex flex-col items-end">
<span class="text-data-md font-data-md text-on-surface font-semibold">₹850.00</span>
<button class="mt-2 text-error hover:bg-error-container/20 p-1 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button></div>
</div>
</div>
<!-- Item 5: Mini Gift Set -->
<div class="bg-surface border-b border-outline-variant px-margin-mobile py-stack-md flex flex-col gap-stack-sm active:bg-surface-container-low transition-colors touch-pan-y w-full">
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase tracking-wider">SKU-G050</span>
<h2 class="text-headline-sm font-headline-sm text-on-surface mt-1">Mini Gift Set</h2>
<span class="text-body-sm font-body-sm text-secondary mt-0.5">Assorted Boxes</span>
</div>
<div class="flex flex-col items-end">
<span class="text-data-md font-data-md text-on-surface font-semibold">₹450.00</span>
<button class="mt-2 text-error hover:bg-error-container/20 p-1 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button></div>
</div>
</div>
</div>
</main>
<!-- Floating Action Button for Add Product -->
<button class="fixed bottom-[80px] right-margin-mobile h-[56px] px-4 bg-primary text-on-primary rounded-2xl shadow-lg flex items-center gap-2 hover:bg-primary-container active:scale-95 transition-all z-40">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'wght' 600;">add</span>
<span class="text-headline-sm font-headline-sm">Add Product</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-gutter pb-safe z-50 h-[64px] border-t border-outline-variant bg-surface shadow-md">
<button class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:bg-surface-container-high transition-colors rounded-xl">
<span class="material-symbols-outlined mb-1">receipt_long</span>
<span class="text-label-caps font-label-caps uppercase">Billing</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 hover:bg-surface-container-high scale-95 transition-transform duration-100 shadow-sm border border-primary-fixed-dim">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: &quot;FILL&quot; 1;">inventory_2</span>
<span class="text-label-caps font-label-caps uppercase">Inventory</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:bg-surface-container-high transition-colors rounded-xl">
<span class="material-symbols-outlined mb-1">assessment</span>
<span class="text-label-caps font-label-caps uppercase">Reports</span>
</button>
</nav>
</div>


</body></html>
